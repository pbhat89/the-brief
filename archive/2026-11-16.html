<script>
/* =============================================================================
   DATA — the routine fills these three structures with real content each day.
   Do NOT touch anything below this comment block other than the data inside

   SECTIONS shape — eleven entries in this exact order:
     id    : one of "sg" | "india" | "uk" | "geo" | "tech" | "biz" | "sports" | "misc" | "fun" | "puzzle" | "wpuzzle"
     title : tab label as shown in the chip row (use the emoji prefixes shown below)
     color : hex color used for the active-tab fill and the section's gradient rule
     items : array of news items (only for the 8 news tabs; fun/puzzle/wpuzzle use custom flag)
       headline : string — declarative headline, no clickbait
       summary  : string — 1-2 specific sentences with names, numbers, outcomes
       source   : string — outlet name (must be on the allowed list for this tab)
       url      : string — the article URL (deep link to the actual story)
       date     : string — short date like "Jun 4" or "May 24"
       spectrum : { left, center, right } OR null — only on political items
                  Each value is a one-sentence summary of how outlets on that side
                  of the spectrum framed the story.
       bias     : string OR null — one short observation about where outlets diverge.
                  Only present where framing genuinely differs across outlets.

   FUN_FACT shape:
     text : string — the fact itself, 2-3 sentences. Verifiable.
     tag  : string — short category label (e.g. "Category · Food & Chemistry")

   PUZZLE shape:
     type     : one of "Visual" | "Logic" | "Quantitative" | "Lateral Thinking"
     title    : short evocative name for the puzzle
     how      : one-line "how to approach" hint
     question : the puzzle itself; supports \n for line breaks
     answer   : the answer; supports \n for line breaks; appears inside a toggle

   WORD_PUZZLE shape (separate, daily word game — NYT-style, static reveal):
     type     : one of "Connections" | "Word Ladder" | "Anagram" | "Spelling Bee" | "Letter Boxed" | "Mini Crossword"
     title    : short evocative name for the word puzzle
     how      : one-line "how to approach" hint
     question : the puzzle body; supports \n for line breaks (grids render as pre-formatted text)
     answer   : the answer; supports \n for line breaks; appears inside its own toggle (id "wpans")
============================================================================= */

const SECTIONS = [
  { id:"sg", title:"🇸🇬 Singapore", color:"#e74c3c", items:[

  ]},

    {"headline": "Israeli strike kills a senior Hamas commander in Gaza despite the truce", "summary": "The Israeli military said it killed Samir Abu Younis, commander of Hamas's Rafah Brigade, in an overnight strike in southern Gaza &mdash; the latest in a run of targeted killings that have continued since the October ceasefire. Gaza's Health Ministry says Israeli fire has killed more than 1,600 Palestinians since the truce took hold.", "source": "CNN", "url": "https://www.cnn.com/2026/11/15/middleeast/israel-kills-hamas-commander-gaza-intl", "date": "Nov 15", "spectrum": null, "bias": null},
    {"headline": "Update: US floats letting Ukraine join NATO if it cedes the rest of Donbas", "summary": "President Volodymyr Zelensky said US envoys Steve Witkoff and Jared Kushner had raised a proposal under which Ukraine could gain NATO membership in exchange for handing Russia the roughly one-fifth of Donbas it does not already control &mdash; a swap Kyiv has long called a red line. The idea surfaced after US-brokered talks in Abu Dhabi produced only a prisoner exchange.", "source": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/11/15/give-donbas-take-nato-seat-could-new-us-pitch-work-for-ukraine-russia", "date": "Nov 15", "spectrum": null, "bias": null},

    {"headline": "SpaceX catches a returning Starship at the launch tower for the first time", "summary": "SpaceX recovered the upper stage of its Starship rocket by catching it with the launch tower's mechanical arms at Starbase, Texas, after a 22-hour orbital flight that deployed Starlink satellites &mdash; a first for the programme and a step toward full reusability. The Super Heavy booster was lost earlier in the flight, denying the company a planned double catch.", "source": "CNBC", "url": "https://www.cnbc.com/2026/11/14/spacex-plans-to-try-first-ever-catch-of-starship-rocket-from-orbit.html", "date": "Nov 14", "spectrum": null, "bias": null},

    {"headline": "Frontier-science coverage is limited in today's edition", "summary": "Several of The Brief's science outlets could not be reached from the routine's network today, so no additional frontier-science item cleared verification against an allowed source. The section returns to full strength in the next edition.", "source": "The Brief", "url": "", "date": "Nov 16", "spectrum": null, "bias": null},

  { id:"puzzle", title:"🧩 Puzzle", color:"#e67e22", custom:"puzzle" },

const FUN_FACT = {
  text: "The Canary Islands are named after dogs, not birds. The name comes from the Latin <i>Canariae Insulae</i>, &lsquo;Islands of the Dogs&rsquo; &mdash; the Roman writer Pliny the Elder recorded that the main island teemed with large dogs. The little yellow canary bird, and the colour, were later named after the islands, not the other way around.",
  tag: "Category &middot; Language & Geography"
};

const PUZZLE = {
  type: "Quantitative",
  title: "Two Candles",
  how: "Write each candle's height as a fraction that falls at a steady rate, then set one equal to twice the other.",
  question: "Two candles of the same height are lit at the same moment. One burns down completely in 4 hours, the other in 3 hours, each at a constant rate.\n\nAfter how long is one candle exactly twice as tall as the other?",
  answer: "2 hours 24 minutes.\n\nLet each candle start at height 1. After t hours the slower (4-hour) candle has height 1 - t/4; the faster (3-hour) candle has height 1 - t/3, so the slower one is always taller.\n\nSet slower = 2 x faster:\n1 - t/4 = 2(1 - t/3)\n1 - t/4 = 2 - 2t/3\nMultiply by 12: 12 - 3t = 24 - 8t\n5t = 12, so t = 2.4 hours = 2 h 24 min.\n\nCheck: slower = 1 - 0.6 = 0.4; faster = 1 - 0.8 = 0.2; and 0.4 = 2 x 0.2. Both are still burning (t < 3), so the answer is unique."
};

const WORD_PUZZLE = {
  type: "Connections",
  title: "False Friends",
  how: "Sort the 16 words into four groups of four. Two words look like they belong in a group they don't &mdash; spot the decoys.",

function renderFun(){
  return '<div class="sec-title">✦ Fun Fact of the Day</div><div class="rule" style="margin-bottom:18px;background:linear-gradient(90deg,#27ae60,transparent)"></div>'+
    '<div class="fun-box"><div class="fun-text">'+FUN_FACT.text+'</div><div class="fun-tag">'+FUN_FACT.tag+'</div></div>';
}
function renderPuzzle(){
  let h='<div class="sec-title">🧩 Daily Puzzle</div><div class="rule" style="margin-bottom:18px;background:linear-gradient(90deg,#e67e22,transparent)"></div>';
  h+='<div class="puzzle-box"><span class="ptype">'+PUZZLE.type+'</span>';
  h+='<div class="puzzle-title">'+PUZZLE.title+'</div>';
  h+='<div class="puzzle-how">How to approach: '+PUZZLE.how+'</div>';
  h+='<div class="puzzle-q">'+PUZZLE.question+'</div>';
  h+='<button class="btn" onclick="toggleAns(this)">Show Answer</button>';
  h+='<div class="answer" id="ans"><span class="alabel">Answer</span>'+PUZZLE.answer+'</div></div>';
  return h;
}
function renderWordPuzzle(){
  let h='<div class="sec-title">🔤 Word Puzzle of the Day</div><div class="rule" style="margin-bottom:18px;background:linear-gradient(90deg,#16a085,transparent)"></div>';
  h+='<div class="wpuzzle-box"><span class="wptype">'+WORD_PUZZLE.type+'</span>';
  h+='<div class="puzzle-title">'+WORD_PUZZLE.title+'</div>';
  h+='<div class="puzzle-how">How to approach: '+WORD_PUZZLE.how+'</div>';
  h+='<div class="puzzle-q">'+WORD_PUZZLE.question+'</div>';
  h+='<button class="btn" onclick="toggleAns(this,\'wpans\')">Show Answer</button>';
  h+='<div class="answer" id="wpans"><span class="alabel">Answer</span>'+WORD_PUZZLE.answer+'</div></div>';
  return h;
}
function toggleAns(btn,ansId){var a=document.getElementById(ansId||'ans');a.classList.toggle('show');btn.textContent=a.classList.contains('show')?'Hide Answer':'Show Answer';}

function render(){
  const tabs=document.getElementById('tabs');const content=document.getElementById('content');
  SECTIONS.forEach((sec,idx)=>{
    const b=document.createElement('button');b.className='tab'+(idx===0?' active':'');b.textContent=sec.title;
    if(idx===0){b.style.background=sec.color;b.style.borderColor=sec.color;b.style.color='#0a0a0f';}
    b.onclick=()=>{
      document.querySelectorAll('.tab').forEach(t=>{t.classList.remove('active');t.style.background='transparent';t.style.borderColor='#2a2a35';t.style.color='#888';});
      b.classList.add('active');b.style.background=sec.color;b.style.borderColor=sec.color;b.style.color='#0a0a0f';
      document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));
      document.getElementById('sec-'+sec.id).classList.add('active');
    };
    tabs.appendChild(b);
    const div=document.createElement('div');div.className='sec'+(idx===0?' active':'');div.id='sec-'+sec.id;
    if(sec.custom==="fun"){div.innerHTML=renderFun();}
    else if(sec.custom==="puzzle"){div.innerHTML=renderPuzzle();}
    else if(sec.custom==="wpuzzle"){div.innerHTML=renderWordPuzzle();}
    else{
      let html='<div class="sec-title">'+sec.title+'</div><div class="rule" style="margin-bottom:8px;background:linear-gradient(90deg,'+sec.color+',transparent)"></div>';
      sec.items.forEach(it=>{
        html+='<div class="item"><div class="headline">'+it.headline+'</div><div class="summary">'+it.summary+'</div>';
        if(it.source){
          var link=it.url?('<a href="'+it.url+'" target="_blank" rel="noopener">'+it.source+'<span class="arrow">↗</span></a>'):('<b style="color:#c9a84c">'+it.source+'</b>');
          html+='<div class="source">— '+link+' · '+it.date+'</div>';
        }
        if(it.spectrum)html+='<div class="spectrum"><div class="spec-cell spec-left"><span class="spec-label">◄ Left</span><div class="txt">'+it.spectrum.left+'</div></div><div class="spec-cell spec-center"><span class="spec-label">● Center</span><div class="txt">'+it.spectrum.center+'</div></div><div class="spec-cell spec-right"><span class="spec-label">Right ►</span><div class="txt">'+it.spectrum.right+'</div></div></div>';
        if(it.bias)html+='<div class="bias-note"><b>◈ Bias Check</b>'+it.bias+'</div>';
        html+='</div>';
      });
      div.innerHTML=html;
    }
    content.appendChild(div);
  });
}
render();
</script>
</body>
</html>
