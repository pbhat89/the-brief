const FUN_FACT = {
  text: "Earth is home to roughly 3 trillion trees, according to a landmark 2015 study in Nature led by Thomas Crowther, while the Milky Way is estimated to hold only about 100 to 400 billion stars. In other words, our entire galaxy&rsquo;s population of suns is comfortably outnumbered by the trees on a single planet.",
  tag: "Category · Botany & Astronomy"
};

const PUZZLE = {
  type: "Quantitative",
  title: "There and Back",
  how: "Average speed is total distance over total time &mdash; not the average of the two speeds. The two legs cover equal distance, not equal time.",
  question: "A cyclist rides from town A to town B at a steady 15 km/h, then immediately returns along the same road to A at 10 km/h.\n\nWhat is her average speed for the whole round trip?",
  answer: "12 km/h.\n\nLet the one-way distance be d. Time out = d/15; time back = d/10.\nTotal time = d/15 + d/10 = 2d/30 + 3d/30 = 5d/30 = d/6.\nTotal distance = 2d.\nAverage speed = 2d ÷ (d/6) = 12 km/h.\n\nNot 12.5 km/h: because she spends more time at the slower speed, the average is pulled below the midpoint. This is the harmonic mean of 15 and 10."
};

const WORD_PUZZLE = {
  type: "Spelling Bee",
  title: "Prime Position",
  how: "Every word must be at least four letters, must include the centre letter, and may use only the seven letters shown (letters can repeat). One word &mdash; the pangram &mdash; uses all seven.",
  question: "Centre letter:  T\nOuter letters:  A  B  E  L  N  O\n\nFind as many words (4+ letters) as you can. Each must contain T and use only these seven letters. There is one pangram that uses all seven letters.",
  answer: "Pangram: NOTABLE (uses A, B, E, L, N, O, T).\n\nA sample of valid words (each contains T, uses only A B E L N O T):\nBEAT · BENT · BELT · BOLT · BOAT · NEAT · NOTE · TONE · ANTE · TONAL · TALON · TOTAL · TABLE · BATON · BLOAT · LATTE · BATTLE · BOTTLE · ABLATE · OBLATE · NOTABLE\n\n(Other valid words exist &mdash; anything 4+ letters that contains T and uses only the seven letters counts.)"
};

/* =============================================================================
   RENDER — DO NOT MODIFY anything below this line. The routine touches only the
   data above.
============================================================================= */

function renderFun(){
  return '<div class="sec-title">✦ Fun Fact of the Day</div><div class="rule" style="margin-bottom:18px;background:linear-gradient(90deg,#27ae60,transparent)"></div>'+
    '<div class="fun-box"><div class="fun-text">'+FUN_FACT.text+'</div><div class="fun-tag">'+FUN_FACT.tag+'</div></div>';
}
function renderPuzzle(){
  let h='<div class="sec-title">🧩 Daily Puzzle</div><div class="rule" style="margin-bottom:18px;background:linear-gradient(90deg,#e67e22,transparent)"></div>';
  h+='<div class="puzzle-box"><span class="ptype">'+PUZZLE.type+'</span>';
  h+='<div class="puzzle-title">'+PUZZLE.title+'</div>';
  h+='<div class="puzzle-how">How to approach: '+PUZZLE.how+'</div>';
  h+='<div class="puzzle-q">'+PUZZLE.question+'</div>';
  h+='<button class="btn" onclick="toggleAns(this)">Show Answer</button>';
  h+='<div class="answer" id="ans"><span class="alabel">Answer</span>'+PUZZLE.answer+'</div></div>';
  return h;
}
function renderWordPuzzle(){
  let h='<div class="sec-title">🔤 Word Puzzle of the Day</div><div class="rule" style="margin-bottom:18px;background:linear-gradient(90deg,#16a085,transparent)"></div>';
  h+='<div class="wpuzzle-box"><span class="wptype">'+WORD_PUZZLE.type+'</span>';
  h+='<div class="puzzle-title">'+WORD_PUZZLE.title+'</div>';
  h+='<div class="puzzle-how">How to approach: '+WORD_PUZZLE.how+'</div>';
  h+='<div class="puzzle-q">'+WORD_PUZZLE.question+'</div>';
  h+='<button class="btn" onclick="toggleAns(this,\'wpans\')">Show Answer</button>';
  h+='<div class="answer" id="wpans"><span class="alabel">Answer</span>'+WORD_PUZZLE.answer+'</div></div>';
  return h;
}
function toggleAns(btn,ansId){var a=document.getElementById(ansId||'ans');a.classList.toggle('show');btn.textContent=a.classList.contains('show')?'Hide Answer':'Show Answer';}

function render(){
  const tabs=document.getElementById('tabs');const content=document.getElementById('content');
  SECTIONS.forEach((sec,idx)=>{
    const b=document.createElement('button');b.className='tab'+(idx===0?' active':'');b.textContent=sec.title;
    if(idx===0){b.style.background=sec.color;b.style.borderColor=sec.color;b.style.color='#0a0a0f';}
    b.onclick=()=>{
      document.querySelectorAll('.tab').forEach(t=>{t.classList.remove('active');t.style.background='transparent';t.style.borderColor='#2a2a35';t.style.color='#888';});
      b.classList.add('active');b.style.background=sec.color;b.style.borderColor=sec.color;b.style.color='#0a0a0f';
      document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));
      document.getElementById('sec-'+sec.id).classList.add('active');
    };
    tabs.appendChild(b);
    const div=document.createElement('div');div.className='sec'+(idx===0?' active':'');div.id='sec-'+sec.id;
    if(sec.custom==="fun"){div.innerHTML=renderFun();}
    else if(sec.custom==="puzzle"){div.innerHTML=renderPuzzle();}
    else if(sec.custom==="wpuzzle"){div.innerHTML=renderWordPuzzle();}
    else{
      let html='<div class="sec-title">'+sec.title+'</div><div class="rule" style="margin-bottom:8px;background:linear-gradient(90deg,'+sec.color+',transparent)"></div>';
      sec.items.forEach(it=>{
        html+='<div class="item"><div class="headline">'+it.headline+'</div><div class="summary">'+it.summary+'</div>';
        if(it.source){
          var link=it.url?('<a href="'+it.url+'" target="_blank" rel="noopener">'+it.source+'<span class="arrow">↗</span></a>'):('<b style="color:#c9a84c">'+it.source+'</b>');
          html+='<div class="source">— '+link+' · '+it.date+'</div>';
        }
        if(it.spectrum)html+='<div class="spectrum"><div class="spec-cell spec-left"><span class="spec-label">◄ Left</span><div class="txt">'+it.spectrum.left+'</div></div><div class="spec-cell spec-center"><span class="spec-label">● Center</span><div class="txt">'+it.spectrum.center+'</div></div><div class="spec-cell spec-right"><span class="spec-label">Right ►</span><div class="txt">'+it.spectrum.right+'</div></div></div>';
        if(it.bias)html+='<div class="bias-note"><b>◈ Bias Check</b>'+it.bias+'</div>';
        html+='</div>';
      });
      div.innerHTML=html;
    }
    content.appendChild(div);
  });
}
render();
</script>
