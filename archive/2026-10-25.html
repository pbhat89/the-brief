    { headline:"Moderna and Merck's mRNA cancer vaccine cuts melanoma recurrence or death by 42% in a phase 3 trial", summary:"A personalized mRNA vaccine, intismeran, combined with Merck's Keytruda cut the risk of recurrence or death by 42% versus Keytruda alone in a 1,137-patient phase 3 melanoma trial, the first mRNA cancer therapy to succeed in a late-stage study; data were presented at ESMO on Oct 24.", source:"Nature", url:"https://www.nature.com/articles/d41586-026-03417-0", date:"Oct 23", spectrum:null, bias:null },
    { headline:"CRISPR prime editing is used directly inside a patient's body for the first time", summary:"Prime Medicine said it had treated the first person in a trial using prime editing to alter DNA in liver cells directly inside the body, a first for the technique, targeting the copper-metabolism disorder Wilson's disease; first results are expected next year.", source:"Scientific American", url:"https://www.scientificamerican.com/article/crispr-treatment-inserted-directly-into-the-body-for-the-first-time/", date:"Oct 22", spectrum:null, bias:null },
    { headline:"Physicists trap a single antimatter particle, a positron, for a month", summary:"Northwestern University physicists reported in Physical Review Letters that they held a single positron suspended and cooled for a month; they plan to measure its magnetic moment against the electron's to probe why the universe is made of matter rather than antimatter.", source:"Scientific American", url:"https://www.scientificamerican.com/article/physicists-trap-a-single-antimatter-particle-for-a-month/", date:"Oct 21", spectrum:null, bias:null },
    { headline:"An AI estimates cancer patients' survival odds from a single photo of their face", summary:"In a Lancet Digital Health study of 3,820 cancer patients, an AI model using face photographs flagged a high-risk group in which 64 of 122 patients died within 90 days of the photo, suggesting facial cues may track biological decline.", source:"Scientific American", url:"https://www.scientificamerican.com/article/can-ai-predict-whether-youll-die-from-cancer-from-just-an-image-of-your-face/", date:"Oct 19", spectrum:null, bias:null }
  ]},
  { id:"fun", title:"✦ Fun Fact", color:"#27ae60", custom:"fun" },
  { id:"puzzle", title:"🧩 Puzzle", color:"#e67e22", custom:"puzzle" },
  { id:"wpuzzle", title:"🔤 Word Puzzles", color:"#16a085", custom:"wpuzzle" },
];

const FUN_FACT = {
  text: "The mantis shrimp has one of the most elaborate visual systems known, with up to 16 types of colour photoreceptor &mdash; compared with just three in humans. Its club-like front limb also strikes so fast that it creates cavitation bubbles, pockets of vapour in the water, whose collapse unleashes a shock wave that can stun or kill prey even when the punch misses.",
  tag: "Category · Biology"
};

const PUZZLE = {
  type: "Lateral Thinking",
  title: "Three Left Turns",
  how: "Stop picturing roads and cars &mdash; ask what kind of &lsquo;home&rsquo; you reach by making exactly three left turns.",
  question: "A man leaves home and runs. He makes a sharp left turn, runs a while, turns left again, runs some more, makes a third left turn, then runs straight back home &mdash; where two masked men are waiting for him. Who are the two masked men?",
  answer: "He is a baseball player. &lsquo;Home&rsquo; is home plate, and the three left turns carry him around first, second and third base. The two masked men waiting for him at home are the catcher and the umpire."
};

const WORD_PUZZLE = {
  type: "Word Ladder",
  title: "Love into Hate",
  how: "Change one letter at each step, keeping every rung a common word, to get from LOVE to HATE in four steps.",
  question: "Climb the ladder from LOVE to HATE. Change exactly one letter at each step, and every rung must be a real, common English word.\n\nLOVE → ? → ? → ? → HATE",
  answer: "LOVE → DOVE → DOTE → DATE → HATE\nEach step changes a single letter: L→D makes DOVE, V→T makes DOTE, O→A makes DATE, and D→H makes HATE."
};

/* =============================================================================
   RENDER — DO NOT MODIFY anything below this line. The routine touches only the
   data above.
============================================================================= */

function renderFun(){
  return '<div class="sec-title">✦ Fun Fact of the Day</div><div class="rule" style="margin-bottom:18px;background:linear-gradient(90deg,#27ae60,transparent)"></div>'+
    '<div class="fun-box"><div class="fun-text">'+FUN_FACT.text+'</div><div class="fun-tag">'+FUN_FACT.tag+'</div></div>';
}
function renderPuzzle(){
  let h='<div class="sec-title">🧩 Daily Puzzle</div><div class="rule" style="margin-bottom:18px;background:linear-gradient(90deg,#e67e22,transparent)"></div>';
  h+='<div class="puzzle-box"><span class="ptype">'+PUZZLE.type+'</span>';
  h+='<div class="puzzle-title">'+PUZZLE.title+'</div>';
  h+='<div class="puzzle-how">How to approach: '+PUZZLE.how+'</div>';
  h+='<div class="puzzle-q">'+PUZZLE.question+'</div>';
  h+='<button class="btn" onclick="toggleAns(this)">Show Answer</button>';
  h+='<div class="answer" id="ans"><span class="alabel">Answer</span>'+PUZZLE.answer+'</div></div>';
  return h;
}
function renderWordPuzzle(){
  let h='<div class="sec-title">🔤 Word Puzzle of the Day</div><div class="rule" style="margin-bottom:18px;background:linear-gradient(90deg,#16a085,transparent)"></div>';
  h+='<div class="wpuzzle-box"><span class="wptype">'+WORD_PUZZLE.type+'</span>';
  h+='<div class="puzzle-title">'+WORD_PUZZLE.title+'</div>';
  h+='<div class="puzzle-how">How to approach: '+WORD_PUZZLE.how+'</div>';
  h+='<div class="puzzle-q">'+WORD_PUZZLE.question+'</div>';
  h+='<button class="btn" onclick="toggleAns(this,\'wpans\')">Show Answer</button>';
  h+='<div class="answer" id="wpans"><span class="alabel">Answer</span>'+WORD_PUZZLE.answer+'</div></div>';
  return h;
}
function toggleAns(btn,ansId){var a=document.getElementById(ansId||'ans');a.classList.toggle('show');btn.textContent=a.classList.contains('show')?'Hide Answer':'Show Answer';}

function render(){
  const tabs=document.getElementById('tabs');const content=document.getElementById('content');
  SECTIONS.forEach((sec,idx)=>{
    const b=document.createElement('button');b.className='tab'+(idx===0?' active':'');b.textContent=sec.title;
    if(idx===0){b.style.background=sec.color;b.style.borderColor=sec.color;b.style.color='#0a0a0f';}
    b.onclick=()=>{
      document.querySelectorAll('.tab').forEach(t=>{t.classList.remove('active');t.style.background='transparent';t.style.borderColor='#2a2a35';t.style.color='#888';});
      b.classList.add('active');b.style.background=sec.color;b.style.borderColor=sec.color;b.style.color='#0a0a0f';
      document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));
      document.getElementById('sec-'+sec.id).classList.add('active');
    };
    tabs.appendChild(b);
    const div=document.createElement('div');div.className='sec'+(idx===0?' active':'');div.id='sec-'+sec.id;
    if(sec.custom==="fun"){div.innerHTML=renderFun();}
    else if(sec.custom==="puzzle"){div.innerHTML=renderPuzzle();}
    else if(sec.custom==="wpuzzle"){div.innerHTML=renderWordPuzzle();}
    else{
      let html='<div class="sec-title">'+sec.title+'</div><div class="rule" style="margin-bottom:8px;background:linear-gradient(90deg,'+sec.color+',transparent)"></div>';
      sec.items.forEach(it=>{
        html+='<div class="item"><div class="headline">'+it.headline+'</div><div class="summary">'+it.summary+'</div>';
        if(it.source){
          var link=it.url?('<a href="'+it.url+'" target="_blank" rel="noopener">'+it.source+'<span class="arrow">↗</span></a>'):('<b style="color:#c9a84c">'+it.source+'</b>');
          html+='<div class="source">— '+link+' · '+it.date+'</div>';
        }
        if(it.spectrum)html+='<div class="spectrum"><div class="spec-cell spec-left"><span class="spec-label">◄ Left</span><div class="txt">'+it.spectrum.left+'</div></div><div class="spec-cell spec-center"><span class="spec-label">● Center</span><div class="txt">'+it.spectrum.center+'</div></div><div class="spec-cell spec-right"><span class="spec-label">Right ►</span><div class="txt">'+it.spectrum.right+'</div></div></div>';
        if(it.bias)html+='<div class="bias-note"><b>◈ Bias Check</b>'+it.bias+'</div>';
        html+='</div>';
      });
      div.innerHTML=html;
    }
    content.appendChild(div);
  });
}
render();
</script>
