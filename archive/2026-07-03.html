     items : array of news items (only for the 8 news tabs; fun/puzzle/wpuzzle use custom flag)

       summary  : string — 1-2 specific sentences with names, numbers, outcomes
       source   : string — outlet name (must be on the allowed list for this tab)
       url      : string — the article URL (deep link to the actual story)
       date     : string — short date like "Jun 4" or "May 24"
       spectrum : { left, center, right } OR null — only on political items
                  Each value is a one-sentence summary of how outlets on that side
                  of the spectrum framed the story.
       bias     : string OR null — one short observation about where outlets diverge.
                  Only present where framing genuinely differs across outlets.

   FUN_FACT shape:
     text : string — the fact itself, 2-3 sentences. Verifiable.
     tag  : string — short category label (e.g. "Category · Food & Chemistry")

   PUZZLE shape:
     type     : one of "Visual" | "Logic" | "Quantitative" | "Lateral Thinking"
     title    : short evocative name for the puzzle
     how      : one-line "how to approach" hint
     question : the puzzle itself; supports \n for line breaks
     answer   : the answer; supports \n for line breaks; appears inside a toggle

============================================================================= */

    { headline:"All drink containers must carry the 10-cent deposit from 1 July as the return scheme's transition ends", summary:"Singapore's Beverage Container Return Scheme became fully mandatory on 1 July after a transition period for clearing older stock ended on 30 June. All in-scope plastic bottles and metal cans from 150ml to 3 litres must now carry the deposit mark and a refundable 10-cent deposit, redeemable at designated return points.", source:"CNA", url:"", date:"Jul 1", spectrum:null, bias:null },
    { headline:"Teenager and four men arrested over a scheme to fraudulently obtain Singpass and bank accounts", summary:"The Anti-Scam Command arrested a 17-year-old girl and four men aged 22 to 29 on 1 July for allegedly conspiring with an overseas syndicate to hand over local bank accounts and trick job-seekers into surrendering their Singpass credentials. The accounts were allegedly used to receive scam proceeds.", source:"Mothership", url:"https://mothership.sg/2026/07/job-scams-singpass-fradulent-obtain/", date:"Jul 1", spectrum:null, bias:null },

  { id:"india", title:"🇮🇳 India", color:"#e67e22", items:[

  text: "A blue whale — the largest animal that has ever lived — has a tongue that can weigh around three tonnes, roughly the weight of an adult elephant. Its heart is about the size of a small piano, weighs some 180 kilograms, and its beat can reportedly be detected from around two miles away. No creature known, living or extinct, has ever grown bigger.",
  tag: "Category · Biology & Marine Life"

const PUZZLE = {
  type: "Logic",
  title: "The Line of Hats",
  how: "Work out what each prisoner can deduce from the others' silence, starting with the one who can see the most.",
  question: "Four prisoners are given hats drawn from a set of two black and two white. They are told the colours in the set but cannot see their own hat.\nThree are buried in a line facing a wall: the man at the back can see the two ahead of him, the middle man sees only the one in front, and the front man sees only the wall.\nThe fourth man is on the other side of the wall and can see no one.\nNo one may speak except to call out the colour of his own hat — and only if he is certain. After a short silence, one man calls out correctly.\nWhich prisoner speaks, and how does he know?",
  answer: "The middle man.\nThe man at the back can see both hats in front of him. If those two were the same colour, he would instantly know his own must be the other colour — and would call out. His silence therefore tells everyone that the two hats ahead of him are of different colours.\nThe middle man hears that silence and can see the front man's hat. Because the two hats in his row must differ, he knows his own is the opposite colour to the one he sees — and calls it out.\nThe front man and the walled-off man can see nothing that fixes their own colour, so they can never be certain."
};

const WORD_PUZZLE = {
  type: "Word Ladder",
  title: "Get Well Soon",
  how: "Change one letter at a time, each step a real word — and think of what sits under a window on the way.",
  question: "Turn SICK into WELL in four steps.\nChange exactly one letter at each step, and every rung must be a real English word.\n\nSICK → _ _ _ _ → _ _ _ _ → _ _ _ _ → WELL",
  answer: "SICK → SILK → SILL → SELL → WELL\n\nSICK to SILK (c→l), SILK to SILL (k→l), SILL to SELL (i→e), then SELL to WELL (s→w). Four steps, each rung a valid word."
};

/* =============================================================================
   RENDER — DO NOT MODIFY anything below this line. The routine touches only the
   data above.
============================================================================= */

function renderFun(){
  return '<div class="sec-title">✦ Fun Fact of the Day</div><div class="rule" style="margin-bottom:18px;background:linear-gradient(90deg,#27ae60,transparent)"></div>'+
    '<div class="fun-box"><div class="fun-text">'+FUN_FACT.text+'</div><div class="fun-tag">'+FUN_FACT.tag+'</div></div>';
}
function renderPuzzle(){
  let h='<div class="sec-title">🧩 Daily Puzzle</div><div class="rule" style="margin-bottom:18px;background:linear-gradient(90deg,#e67e22,transparent)"></div>';
  h+='<div class="puzzle-box"><span class="ptype">'+PUZZLE.type+'</span>';
  h+='<div class="puzzle-title">'+PUZZLE.title+'</div>';
  h+='<div class="puzzle-how">How to approach: '+PUZZLE.how+'</div>';
  h+='<div class="puzzle-q">'+PUZZLE.question+'</div>';
  h+='<button class="btn" onclick="toggleAns(this)">Show Answer</button>';
  h+='<div class="answer" id="ans"><span class="alabel">Answer</span>'+PUZZLE.answer+'</div></div>';
  return h;
}
function renderWordPuzzle(){
  let h='<div class="sec-title">🔤 Word Puzzle of the Day</div><div class="rule" style="margin-bottom:18px;background:linear-gradient(90deg,#16a085,transparent)"></div>';
  h+='<div class="wpuzzle-box"><span class="wptype">'+WORD_PUZZLE.type+'</span>';
  h+='<div class="puzzle-title">'+WORD_PUZZLE.title+'</div>';
  h+='<div class="puzzle-how">How to approach: '+WORD_PUZZLE.how+'</div>';
  h+='<div class="puzzle-q">'+WORD_PUZZLE.question+'</div>';
  h+='<button class="btn" onclick="toggleAns(this,\'wpans\')">Show Answer</button>';
  h+='<div class="answer" id="wpans"><span class="alabel">Answer</span>'+WORD_PUZZLE.answer+'</div></div>';
  return h;
}
function toggleAns(btn,ansId){var a=document.getElementById(ansId||'ans');a.classList.toggle('show');btn.textContent=a.classList.contains('show')?'Hide Answer':'Show Answer';}

function render(){
  const tabs=document.getElementById('tabs');const content=document.getElementById('content');
  SECTIONS.forEach((sec,idx)=>{
    const b=document.createElement('button');b.className='tab'+(idx===0?' active':'');b.textContent=sec.title;
    if(idx===0){b.style.background=sec.color;b.style.borderColor=sec.color;b.style.color='#0a0a0f';}
    b.onclick=()=>{
      document.querySelectorAll('.tab').forEach(t=>{t.classList.remove('active');t.style.background='transparent';t.style.borderColor='#2a2a35';t.style.color='#888';});
      b.classList.add('active');b.style.background=sec.color;b.style.borderColor=sec.color;b.style.color='#0a0a0f';
      document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));
      document.getElementById('sec-'+sec.id).classList.add('active');
    };
    tabs.appendChild(b);
    const div=document.createElement('div');div.className='sec'+(idx===0?' active':'');div.id='sec-'+sec.id;
    if(sec.custom==="fun"){div.innerHTML=renderFun();}
    else if(sec.custom==="puzzle"){div.innerHTML=renderPuzzle();}
    else if(sec.custom==="wpuzzle"){div.innerHTML=renderWordPuzzle();}
    else{
      let html='<div class="sec-title">'+sec.title+'</div><div class="rule" style="margin-bottom:8px;background:linear-gradient(90deg,'+sec.color+',transparent)"></div>';
      sec.items.forEach(it=>{
        html+='<div class="item"><div class="headline">'+it.headline+'</div><div class="summary">'+it.summary+'</div>';
        if(it.source){
          var link=it.url?('<a href="'+it.url+'" target="_blank" rel="noopener">'+it.source+'<span class="arrow">↗</span></a>'):('<b style="color:#c9a84c">'+it.source+'</b>');
          html+='<div class="source">— '+link+' · '+it.date+'</div>';
        }
        if(it.spectrum)html+='<div class="spectrum"><div class="spec-cell spec-left"><span class="spec-label">◄ Left</span><div class="txt">'+it.spectrum.left+'</div></div><div class="spec-cell spec-center"><span class="spec-label">● Center</span><div class="txt">'+it.spectrum.center+'</div></div><div class="spec-cell spec-right"><span class="spec-label">Right ►</span><div class="txt">'+it.spectrum.right+'</div></div></div>';
        if(it.bias)html+='<div class="bias-note"><b>◈ Bias Check</b>'+it.bias+'</div>';
        html+='</div>';
      });
      div.innerHTML=html;
    }
    content.appendChild(div);
  });
}
render();
</script>
