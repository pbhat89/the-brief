    { headline:"Astronomers match the stars in Van Gogh's 'The Starry Night' to the Hyades cluster", summary:"Writing in Scientific Reports, researchers said the swirling stars in Van Gogh's 'The Starry Night' match the V-shaped Hyades cluster in Taurus as it appeared over Saint-Remy on 22 July 1889.", source:"Scientific American", url:"https://www.scientificamerican.com/article/astronomers-unlock-a-mystery-hidden-in-van-goghs-the-starry-night/", date:"Oct 22", spectrum:null, bias:null },
    { headline:"NASA revises its Thwaites 'Doomsday' Glacier forecast, warning of faster sea-level rise", summary:"A NASA study refined projections for Antarctica's Thwaites 'Doomsday' Glacier, finding it could contribute more to sea-level rise by the end of the century than some earlier estimates had suggested.", source:"NASA", url:"https://science.nasa.gov/blogs/science-news/2026/10/20/nasa-refines-thwaites-glacier-projections/", date:"Oct 20", spectrum:null, bias:null },
    { headline:"NASA's Perseverance sets an off-world driving record, passing Opportunity's distance on Mars", summary:"NASA's Perseverance rover set an off-world driving record on Mars, its odometer reaching 28.10 miles (45.22 km) to surpass Opportunity's mark; it has driven more than 90% of that distance using autonomous navigation.", source:"NASA", url:"https://science.nasa.gov/blogs/perseverance-mars-rover/2026/10/12/nasas-perseverance-sets-off-world-record-for-total-distance-driven/", date:"Oct 12", spectrum:null, bias:null },
    { headline:"Scientists turn cloned male mouse embryos into fertile females in a first for genetics", summary:"Researchers reported a first: using a CRISPR-based 'Y-CUT' technique to remove the Y chromosome, they turned cloned male mouse embryos into healthy, fertile females — a method that could help rescue endangered species with few survivors.", source:"Scientific American", url:"https://www.scientificamerican.com/article/sex-changing-mouse-clones-may-help-fight-to-save-endangered-species/", date:"Oct 14", spectrum:null, bias:null },
  ]},
  { id:"fun", title:"✦ Fun Fact", color:"#27ae60", custom:"fun" },
  { id:"puzzle", title:"🧩 Puzzle", color:"#e67e22", custom:"puzzle" },
  { id:"wpuzzle", title:"🔤 Word Puzzles", color:"#16a085", custom:"wpuzzle" },
];

const FUN_FACT = {
  text: "A single teaspoon of neutron-star material would weigh roughly a billion tonnes on Earth — about the mass of a mountain. Neutron stars cram more than the Sun's mass into a sphere only about 20 kilometres across, making them the densest objects known short of black holes.",
  tag: "Category · Space & Physics"
};

const PUZZLE = {
  type: "Quantitative",
  title: "Split the Bill",
  how: "Let the group size be n and the total bill T, then turn each ‘what if’ into an equation and solve the pair.",
  question: "A group of friends split a restaurant bill equally.\nHad there been 2 more friends, each would have paid $6 less.\nHad there been 3 fewer friends, each would have paid $12 more.\nHow many friends were there, and what was the total bill?",
  answer: "18 friends, and a total bill of $1,080 (so each paid $60).\n\nLet T be the total and n the number of friends. Then T/(n+2) = T/n − 6 gives T = 3n(n+2), and T/(n−3) = T/n + 12 gives T = 4n(n−3). Setting them equal: 3(n+2) = 4(n−3), so n = 18 and T = 3 × 18 × 20 = 1,080.\nCheck: 1,080/20 = $54 (= 60 − 6) and 1,080/15 = $72 (= 60 + 12)."
};

const WORD_PUZZLE = {
  type: "Connections",
  title: "Cross Purposes",
  how: "Sort the 16 words into four groups of four. One word in each group looks like it belongs elsewhere — the overlap traps are the whole game.",
  question: "JAB · HOOK · CARP · CROP\nMULLET · BREAM · WHINE · CROSS\nFADE · TROUT · GRIPE · UPPERCUT\nPERM · PIKE · BEEF · MOAN",
  answer: "Boxing punches: JAB, HOOK, CROSS, UPPERCUT\nHairstyles: CROP, FADE, MULLET, PERM\nFreshwater fish: CARP, BREAM, TROUT, PIKE\nWays to complain: WHINE, GRIPE, BEEF, MOAN\n\nTraps: HOOK (also fishing), MULLET (also a fish), CARP (also to complain), BEEF (also a grievance)."
};

/* =============================================================================
   RENDER — DO NOT MODIFY anything below this line. The routine touches only the
   data above.
============================================================================= */

function renderFun(){
  return '<div class="sec-title">✦ Fun Fact of the Day</div><div class="rule" style="margin-bottom:18px;background:linear-gradient(90deg,#27ae60,transparent)"></div>'+
    '<div class="fun-box"><div class="fun-text">'+FUN_FACT.text+'</div><div class="fun-tag">'+FUN_FACT.tag+'</div></div>';
}
function renderPuzzle(){
  let h='<div class="sec-title">🧩 Daily Puzzle</div><div class="rule" style="margin-bottom:18px;background:linear-gradient(90deg,#e67e22,transparent)"></div>';
  h+='<div class="puzzle-box"><span class="ptype">'+PUZZLE.type+'</span>';
  h+='<div class="puzzle-title">'+PUZZLE.title+'</div>';
  h+='<div class="puzzle-how">How to approach: '+PUZZLE.how+'</div>';
  h+='<div class="puzzle-q">'+PUZZLE.question+'</div>';
  h+='<button class="btn" onclick="toggleAns(this)">Show Answer</button>';
  h+='<div class="answer" id="ans"><span class="alabel">Answer</span>'+PUZZLE.answer+'</div></div>';
  return h;
}
function renderWordPuzzle(){
  let h='<div class="sec-title">🔤 Word Puzzle of the Day</div><div class="rule" style="margin-bottom:18px;background:linear-gradient(90deg,#16a085,transparent)"></div>';
  h+='<div class="wpuzzle-box"><span class="wptype">'+WORD_PUZZLE.type+'</span>';
  h+='<div class="puzzle-title">'+WORD_PUZZLE.title+'</div>';
  h+='<div class="puzzle-how">How to approach: '+WORD_PUZZLE.how+'</div>';
  h+='<div class="puzzle-q">'+WORD_PUZZLE.question+'</div>';
  h+='<button class="btn" onclick="toggleAns(this,\'wpans\')">Show Answer</button>';
  h+='<div class="answer" id="wpans"><span class="alabel">Answer</span>'+WORD_PUZZLE.answer+'</div></div>';
  return h;
}
function toggleAns(btn,ansId){var a=document.getElementById(ansId||'ans');a.classList.toggle('show');btn.textContent=a.classList.contains('show')?'Hide Answer':'Show Answer';}

function render(){
  const tabs=document.getElementById('tabs');const content=document.getElementById('content');
  SECTIONS.forEach((sec,idx)=>{
    const b=document.createElement('button');b.className='tab'+(idx===0?' active':'');b.textContent=sec.title;
    if(idx===0){b.style.background=sec.color;b.style.borderColor=sec.color;b.style.color='#0a0a0f';}
    b.onclick=()=>{
      document.querySelectorAll('.tab').forEach(t=>{t.classList.remove('active');t.style.background='transparent';t.style.borderColor='#2a2a35';t.style.color='#888';});
      b.classList.add('active');b.style.background=sec.color;b.style.borderColor=sec.color;b.style.color='#0a0a0f';
      document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));
      document.getElementById('sec-'+sec.id).classList.add('active');
    };
    tabs.appendChild(b);
    const div=document.createElement('div');div.className='sec'+(idx===0?' active':'');div.id='sec-'+sec.id;
    if(sec.custom==="fun"){div.innerHTML=renderFun();}
    else if(sec.custom==="puzzle"){div.innerHTML=renderPuzzle();}
    else if(sec.custom==="wpuzzle"){div.innerHTML=renderWordPuzzle();}
    else{
      let html='<div class="sec-title">'+sec.title+'</div><div class="rule" style="margin-bottom:8px;background:linear-gradient(90deg,'+sec.color+',transparent)"></div>';
      sec.items.forEach(it=>{
        html+='<div class="item"><div class="headline">'+it.headline+'</div><div class="summary">'+it.summary+'</div>';
        if(it.source){
          var link=it.url?('<a href="'+it.url+'" target="_blank" rel="noopener">'+it.source+'<span class="arrow">↗</span></a>'):('<b style="color:#c9a84c">'+it.source+'</b>');
          html+='<div class="source">— '+link+' · '+it.date+'</div>';
        }
        if(it.spectrum)html+='<div class="spectrum"><div class="spec-cell spec-left"><span class="spec-label">◄ Left</span><div class="txt">'+it.spectrum.left+'</div></div><div class="spec-cell spec-center"><span class="spec-label">● Center</span><div class="txt">'+it.spectrum.center+'</div></div><div class="spec-cell spec-right"><span class="spec-label">Right ►</span><div class="txt">'+it.spectrum.right+'</div></div></div>';
        if(it.bias)html+='<div class="bias-note"><b>◈ Bias Check</b>'+it.bias+'</div>';
        html+='</div>';
      });
      div.innerHTML=html;
    }
    content.appendChild(div);
  });
}
render();
</script>
