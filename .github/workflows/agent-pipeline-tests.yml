name: Agent pipeline tests (no credentials)
on:
  push:
    paths: ['podcast/agent_pipeline/**', '.github/workflows/agent-pipeline-tests.yml']
  pull_request:
    paths: ['podcast/agent_pipeline/**', '.github/workflows/agent-pipeline-tests.yml']
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: pip install -r podcast/agent_pipeline/requirements.txt
      - run: python -m unittest discover -s podcast/agent_pipeline/tests -v
      - run: python -m unittest podcast.agent_pipeline.test_content podcast.agent_pipeline.test_audit podcast.agent_pipeline.test_source_intake podcast.agent_pipeline.test_source_repair -v
