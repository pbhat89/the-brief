name: Brief regression and optional Worker deploy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: brief-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: podcast/cloudflare
      - run: node --test podcast/*.test.mjs
      - run: node podcast/validate.mjs
      - run: node podcast/validate-editorial.mjs
      - run: node podcast/validate-expert-learning.mjs
      - run: node podcast/validate-podcast-learning.mjs
      - run: node podcast/cloudflare/scripts/validate-repository.mjs
      - run: npm test
        working-directory: podcast/cloudflare
      - run: npx playwright install --with-deps chromium
        working-directory: podcast/cloudflare
      - run: node scripts/original-browser-check.mjs
        working-directory: podcast/cloudflare
      - run: node scripts/daily-layout-browser-check.mjs
        working-directory: podcast/cloudflare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: original-reader-public-qa
          path: podcast/cloudflare/qa-original/*.png
          retention-days: 7
      - run: npm run check
        working-directory: podcast/cloudflare
      - run: node scripts/runtime-check.mjs
        working-directory: podcast/cloudflare
      - run: npm audit --omit=optional --audit-level=high
        working-directory: podcast/cloudflare
  deploy:
    needs: regression
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_CF_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudflare-production
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: podcast/cloudflare
      - name: Deploy tested source without private configuration output
        working-directory: podcast/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_ID: ${{ secrets.CF_KV_ID }}
          CF_WORKER_NAME: ${{ secrets.CF_WORKER_NAME }}
          AUDIO_EXPIRY_APPROVED: ${{ vars.AUDIO_EXPIRY_APPROVED }}
          WRANGLER_SEND_METRICS: 'false'
        run: node scripts/deploy-ci.mjs

